<body>
  <center>
    <div>
      <!-- <h1>Balatro</h1> -->
      <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="2560" height="1351" style="display: none;"></canvas>
      <canvas id="canvas" oncontextmenu="event.preventDefault()" width="286" height="1351" style="cursor: default; visibility: visible;"></canvas>
    </div>
  </center>
  <script type="text/javascript">
    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 256000000,
  
      // 🔥 Force WASM to load from CDN
      locateFile: function(path) {
        if (path.endsWith(".wasm")) {
          return "https://cdn.jsdelivr.net/gh/imarcussun2-afk/balatro-web@main/" + path;
        }
        return path;
      },
  
      printErr: console.error.bind(console),
  
      canvas: (function() {
        var canvas = document.getElementById('canvas');
  
        canvas.addEventListener("webglcontextlost", function(e) {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);
  
        return canvas;
      })(),
  
      setStatus: function(text) {
        if (text) {
          drawLoadingText(text);
        } else if (Module.remainingDependencies === 0) {
          document.getElementById('loadingCanvas').style.display = 'none';
          document.getElementById('canvas').style.visibility = 'visible';
        }
      },
  
      totalDependencies: 0,
      remainingDependencies: 0,
  
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(
          left
            ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
            : 'All downloads complete.'
        );
      }
    };
  
    Module.setStatus('Downloading...');
  
    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };
  
    var applicationLoad = function(e) {
      Love(Module);
    }
  </script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/imarcussun2-afk/balatro-web@main/game.js?v=d7e34743-2fea-4de6-8a0e-1103b5fcf07f"></script>
  <script async="" type="text/javascript" src="https://cdn.jsdelivr.net/gh/imarcussun2-afk/balatro-web@main/love.js" onload="applicationLoad(this)"></script>
